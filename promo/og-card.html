<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,system-ui,sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 60%,#1a4d6e 100%);color:#fff;position:relative}
body::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 45% 42% at 82% 10%,rgba(26,86,219,.36) 0,transparent 62%),
             radial-gradient(ellipse 42% 38% at 12% 92%,rgba(13,148,136,.28) 0,transparent 60%)}
body::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:56px 64px}
.badge{align-self:flex-start;padding:6px 16px;border-radius:100px;background:rgba(245,158,11,.15);
  border:1px solid rgba(245,158,11,.45);color:#fbbf24;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
img{height:104px;width:auto;margin:26px 0 22px}
h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:52px;line-height:1.1;letter-spacing:-.015em;max-width:1010px}
.meta{display:flex;align-items:center;gap:14px;margin-top:26px;font-size:19px;color:rgba(255,255,255,.80)}
.meta b{color:#fff;font-weight:600}
.dot{opacity:.4}
.speakers{margin-top:20px;font-size:15.5px;color:rgba(255,255,255,.62);line-height:1.5}
.speakers b{color:rgba(255,255,255,.85);font-weight:600}
.url{position:absolute;right:64px;bottom:44px;font-size:15px;color:rgba(255,255,255,.55)}
</style></head><body><div class="wrap">
  <span class="badge">IROS 2026 Workshop</span>
  <img src="../img/logo.svg" alt="">
  <h1>Compositional and Modular Learning<br>in the Era of Scaling in Robotics</h1>
  <div class="meta"><b>Sunday, September 27, 2026</b><span class="dot">·</span><span>8:30 AM – 12:30 PM</span>
    <span class="dot">·</span><span>Pittsburgh, PA, USA</span></div>
  <div class="speakers"><b>Speakers:</b> Yilun Du · Jiayuan Mao · Eric Rosen · Nakul Gopalan · Leslie Kaelbling · Eric Eaton</div>
  <div class="url">compositional-robotics.github.io</div>
</div></body></html>
